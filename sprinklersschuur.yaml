substitutions:
  device_name: "SprinklersSchuur"
  device_id: "sprinklersschuur"
  sprinklers: "Sprinkler Schuur"
  lawn1: "Sprinkler bomen"
  lawn2: "Sprinkler terras"
  lawn3: "Sprinkler hondenhok"
  run_duration: 1800s
  valve_change_duration: 30s
  initial_runtime: 40

esphome:
  name: ${device_id}
  friendly_name: ${device_name}

esp8266:
  board: esp12e

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "CkqimbqaB0gvIxnRTpxzSLPH33c00y+1CBMqUxoos+A="

ota:
  - platform: esphome
    password: "c87692c3584919053ef7a0bafda1bfdf"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_id}
    password: "0OJc1NhsNYES"

captive_portal:

web_server:
  port: 80

# -----------------------------------------------------------------------------
# Sensors
# -----------------------------------------------------------------------------
# Text sensors with general information.
text_sensor:
  # Expose Uptime human readable
  - platform: template
    name: ${device_name} Uptime
    id: ${device_id}_uptime_human
    icon: mdi:clock-start
  # Expose ESPHome version as sensor.
  - platform: version
    name: ${device_name} ESPHome Version

sensor:
# WiFi Signal sensor.
  - platform: wifi_signal
    name: ${device_name} WiFi Signal
    update_interval: 360s
# Uptime sensor.
  - platform: uptime
    id: ${device_id}_uptime_sensor
    update_interval: 60s
    on_raw_value:
      then:
        - text_sensor.template.publish:
            id: ${device_id}_uptime_human
            state: !lambda |-
              int seconds = round(id(${device_id}_uptime_sensor).get_raw_state());
              int days = seconds / (24 * 3600);
              seconds = seconds % (24 * 3600);
              int hours = seconds / 3600;
              seconds = seconds % 3600;
              int minutes = seconds /  60;
              seconds = seconds % 60;
              return (
                (days ? String(days) + "d " : "") +
                (hours ? String(hours) + "h " : "") +
                (minutes ? String(minutes) + "m " : "") +
                (String(seconds) + "s")
              ).c_str();

# -----------------------------------------------------------------------------
# Binary Sensors
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Switches
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    pin: GPIO15
    name: Pomp
    id: relay5
  - platform: gpio
    pin: GPIO00
    name: Relay6
    id: relay6
  - platform: gpio
    pin: GPIO04
    name: Relay7
    id: relay7
    internal: true
    on_state:
      - then: 
          - script.execute: activateValves
  - platform: gpio
    pin: GPIO05
    name: Relay8
    id: relay8
    internal: true
    on_state:
      - then: 
          - script.execute: activateValves

  - platform: hbridge
    id: control_valve_1
    name: "Valve 1"
    on_pin: GPIO14
    off_pin: GPIO16
    pulse_length: ${valve_change_duration} 
    wait_time: 1s
    internal: True

  - platform: hbridge
    id: control_valve_2
    name: "Valve 2"
    on_pin: GPIO13
    off_pin: GPIO12
    pulse_length: ${valve_change_duration} 
    wait_time: 1s
    internal: True

# -----------------------------------------------------------------------------
# Sprinklers
# -----------------------------------------------------------------------------
sprinkler:
  - id: lawn_sprinkler_ctrlr
    main_switch: "${sprinklers}"
    auto_advance_switch: "${sprinklers} Auto Advance"
    reverse_switch: "${sprinklers} Reverse"
    valve_open_delay: 5s
    pump_start_pump_delay: ${valve_change_duration}  
    pump_stop_valve_delay: ${valve_change_duration}       
    valves:
      - valve_switch: ${lawn1}
        enable_switch: "Enable ${lawn1}"
        pump_switch_id: relay5
        run_duration_number:
          id: run_duration_bomen
          name: "Duurtijd ${lawn1}"
          icon: "mdi:timer-outline"
          initial_value: ${initial_runtime}
          min_value: 5
          max_value: 90
          unit_of_measurement: min
        valve_switch_id: control_valve_1
      - valve_switch: ${lawn2}
        enable_switch: "Enable ${lawn2}"
        pump_switch_id: relay5
        run_duration_number:
          id: run_duration_terras
          name: "Duurtijd ${lawn2}"
          icon: "mdi:timer-outline"
          initial_value: ${initial_runtime}
          min_value: 5
          max_value: 90
          unit_of_measurement: min
        valve_switch_id: control_valve_2
      - valve_switch: ${lawn3}
        enable_switch: "Enable ${lawn3}"
        run_duration_number:
          id: run_duration_hondenhok
          name: "Duurtijd ${lawn3}"
          icon: "mdi:timer-outline"
          initial_value: ${initial_runtime}
          min_value: 5
          max_value: 90
          unit_of_measurement: min
        valve_switch_id: relay8

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:
  - id: activateValves
    mode: restart
    then:
      - switch.turn_on: relay6
      - delay: 5min
      - switch.turn_off: relay6
