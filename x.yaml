# -----------------------------------------------------------------------------
# Substitution Variables
# -----------------------------------------------------------------------------
substitutions:
  device_internal_name: testes32s
  device_friendly_name: testes32s
  device_wifi_name: testes32s
  device_sampling_time: 30s

# -----------------------------------------------------------------------------
# Common Packages
# -----------------------------------------------------------------------------
packages:
  # ---------------------------------------------------------------------------
  # Board
  # ---------------------------------------------------------------------------
  board: !include boards/esp32/lolind32pro.yaml
  settings: !include common/core/settings.yaml

  # ---------------------------------------------------------------------------
  # Network
  # ---------------------------------------------------------------------------
  wifi: !include common/network/wifi.yaml
  webserver: !include
    file: common/network/webserver.yaml
    vars:
      version: 3
  bluetooth: !include common/network/bluetooth_tracker.yaml

# -----------------------------------------------------------------------------
# Custom Device Configuration
# -----------------------------------------------------------------------------
# SPI
spi:
  id: lcd_spi
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18
  #cs_pin: 

# -----------------------------------------------------------------------------
# Number
# -----------------------------------------------------------------------------
number:
  - platform: template
    name: LVGL Screen Timeout
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 15
    min_value: 10
    max_value: 180
    step: 5
    mode: box
    optimistic: true

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  - platform: gpio
    pin: GPIO15 
    id: light_output_backlight
    inverted: true

# -----------------------------------------------------------------------------
# Lights
# -----------------------------------------------------------------------------
light:
  - platform: binary
    output: light_output_backlight
    id: displaybacklight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

# -----------------------------------------------------------------------------
# Sensors
# -----------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: tempPelletKetel
    entity_id: sensor.pellematic_heater_1_temperature
    on_value:
      then:
        - lvgl.label.update: 
            id: lblTempPellet
            text:
              format: "Temperatuur: %.1f °C"
              args: [ 'x' ]

# -----------------------------------------------------------------------------
# Binary Sensors
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Switchs
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 20

display:
  - platform: mipi_spi
    id: my_display
    model: ILI9341
    spi_id: lcd_spi
    dc_pin: GPIO4
    cs_pin: GPIO5
    reset_pin: GPIO22
    #color_depth: 8bit       # Voorkomt geheugencrashes (16bit kan mits PSRAM)
#    rotation: 90
#    lambda: |-
#      // Print the string "Hello World!" at [0,10]
#      it.line(0, 0, 50, 50);
#      it.print(0, 10, id(my_font), "Hello World!");

# -----------------------------------------------------------------------------
# Touchscreen
# -----------------------------------------------------------------------------
touchscreen:
  platform: xpt2046
  cs_pin: GPIO14
  #interrupt_pin: GPIO2
  update_interval: 50ms
  threshold: 400
#  transform:
#    mirror_x: true
  calibration:
    x_min: 220
    x_max: 3800
    y_min: 280
    y_max: 3830
  transform:
    swap_xy: false
    mirror_x: true
    mirror_y: false
  on_release:
    - if:
        condition: lvgl.is_paused
        then:
          - logger.log: "LVGL resuming"
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: displaybacklight
  
# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Bluetooth
# -----------------------------------------------------------------------------
esp32_ble_tracker:

ble_client:
  - mac_address: DE:40:EE:1E:E5:59
    id: itag_black
    auto_connect: true

# -----------------------------------------------------------------------------
# Lvgl
# -----------------------------------------------------------------------------
lvgl:
  rotation: 90  # <-- Place rotation here
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: displaybacklight
      - lvgl.pause:
  pages:
    - id: canvas_1
      bg_opa: 100%
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - tabview:
            id: lv_tabview_1
            x: 0
            y: 0
            width: 320
            height: 240
            align: TOP_LEFT
            tabs:
              - name: Tab 1
                scrollbar_mode: "OFF"
                widgets:
                  - bar:
                      id: lv_bar_2
                      x: 34
                      y: 45
                      width: 200
                      height: 30
                      value: 50
                      min_value: 0
                      max_value: 100
                  - button:
                      id: lv_button_4
                      x: 151
                      y: 140
                      width: 100
                      height: 40
                      widgets:
                        - label:
                            align: CENTER
                            text: "Button"
                  - label:
                      id: lblTempPellet
                      x: 43
                      y: 84
                      width: 80
                      height: 40
                      text: "sdfs"
              - name: Tab 2
                scrollbar_mode: "OFF"
                widgets:
                  - checkbox:
                      id: lv_checkbox_5
                      x: 101
                      y: 72
                      text: "Checkbox"
                      pad_column: 10
              - name: Tab 3
                scrollbar_mode: "OFF"
                widgets:
                  - dropdown:
                      id: lv_dropdown_6
                      x: 125
                      y: 73
                      width: 150
                      height: 40
                      options:
                        - "Option 1"
                        - "Option 2"
                        - "Option 3"
                      selected_index: 0