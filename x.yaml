# -----------------------------------------------------------------------------
# Substitution Variables
# -----------------------------------------------------------------------------
substitutions:
  device_internal_name: testes32s
  device_friendly_name: testes32s
  device_wifi_name: testes32s
  device_sampling_time: 30s

# -----------------------------------------------------------------------------
# Common Packages
# -----------------------------------------------------------------------------
packages:
  # ---------------------------------------------------------------------------
  # Board
  # ---------------------------------------------------------------------------
  board: !include boards/esp32/lolind32pro.yaml
  settings: !include common/core/settings.yaml

  # ---------------------------------------------------------------------------
  # Network
  # ---------------------------------------------------------------------------
  wifi: !include common/network/wifi.yaml
  webserver: !include
    file: common/network/webserver.yaml
    vars:
      version: 3
  bluetooth: !include common/network/bluetooth_tracker.yaml

esphome:
  on_boot:
    - delay: 5s
    - lvgl.widget.hide: boot_screen
  
ota:
  - platform: esphome
    on_begin:
      - lvgl.widget.show: ota_box
      - if:
          condition: 
            light.is_off: displaybacklight
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: displaybacklight
      - lvgl.label.update:
          id: ota_label
          text: "Updating..."
      - lvgl.bar.update:
          id: ota_bar
          value: 0
      - lambda: id(lvgl_id).loop();
    on_progress:
      - lvgl.bar.update:
          id: ota_bar
          value: !lambda return x;
      - lvgl.label.update:
          id: ota_label
          text:
            format: "Updating... %.0f%%"
            args: [x]
      - lambda: id(lvgl_id).loop();
    on_end:
      - lvgl.bar.update:
          id: ota_bar
          value: 100
      - lvgl.label.update:
          id: ota_label
          text: "Update complete, rebooting"
      - lambda: id(lvgl_id).loop();
    on_error:
      - lvgl.label.update:
          id: ota_label
          text:
            format: "Update failed (error %u)"
            args: [x]
      - lambda: id(lvgl_id).loop();
    password: TesterkeX25
  
# -----------------------------------------------------------------------------
# Custom Device Configuration
# -----------------------------------------------------------------------------
# SPI
spi:
  id: lcd_spi
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18
  #cs_pin: 

# -----------------------------------------------------------------------------
# Number
# -----------------------------------------------------------------------------
#number:
#  - platform: template
#    name: LVGL Screen Timeout
#    id: display_timeout
#    unit_of_measurement: "s"
#    initial_value: 15
#    min_value: 10
#    max_value: 180
#    step: 5
#    mode: box
#    optimistic: true
number:
  - platform: lvgl
    id: display_timeout
    widget: lv_slidertimeout
    name: "LVGL Screen Timeout"
    restore_value: true
    trigger: on_release
    
# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
image:
  - platform: file
    file: https://media.esphome.io/logo/logo.png
    id: boot_logo
    resize: 200x200
    type: RGB565
    transparency: alpha_channel

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  - platform: gpio
    pin: GPIO15 
    id: light_output_backlight
    inverted: true

# -----------------------------------------------------------------------------
# Time
# -----------------------------------------------------------------------------
time:
  - platform: sntp
    on_time:
      - hours: 2,3,4,5
        minutes: 5
        seconds: 0
        then:
          - switch.turn_on: switch_antiburn
      - hours: 2,3,4,5
        minutes: 35
        seconds: 0
        then:
          - switch.turn_off: switch_antiburn
    on_time_sync:
      then:
        - logger.log: "Synchronized system clock"

# -----------------------------------------------------------------------------
# Lights
# -----------------------------------------------------------------------------
light:
  - platform: binary
    output: light_output_backlight
    id: displaybacklight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

# -----------------------------------------------------------------------------
# Sensors
# -----------------------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: tempPelletKetel
    entity_id: sensor.pellematic_heater_1_temperature
#    on_value:
#      then:
#        - lvgl.label.update: 
#            id: lblTempPellet
#            text:
#              format: "Temperatuur: %.1f °C"
#              args: [ 'x' ]

# -----------------------------------------------------------------------------
# Binary Sensors
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Switchs
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:

  - platform: homeassistant
    id: ha_read_hp
    entity_id: input_boolean.read_heat_pump
    on_state:
      - lvgl.widget.update: 
          id: lv_cb_read_hp
          state:
            checked: !lambda return id(ha_read_hp).state;
            
# -----------------------------------------------------------------------------
# Fonts
# -----------------------------------------------------------------------------
font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: mdi_font
    size: 32
    bpp: 4 # Anti-aliasing instelling (1 tot 8). 4 of 8 geeft mooie ronde randen.
    glyphs:
      - "\U000F050F" # mdi:thermometer
      - "\U000F0493" # mdi:cog
      #- "\U000F04B0" # mdi-play (Afspelen)
                
# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------
display:
  - platform: mipi_spi
    id: my_display
    model: ILI9341
    spi_id: lcd_spi
    dc_pin: GPIO4
    cs_pin: GPIO5
    reset_pin: GPIO22

# -----------------------------------------------------------------------------
# Touchscreen
# -----------------------------------------------------------------------------
touchscreen:
  platform: xpt2046
  cs_pin: GPIO14
  #interrupt_pin: GPIO2
  update_interval: 50ms
  threshold: 400
#  transform:
#    mirror_x: true
  calibration:
    x_min: 220
    x_max: 3800
    y_min: 280
    y_max: 3830
  transform:
    swap_xy: false
    mirror_x: true
    mirror_y: false
  on_release:
    - if:
        condition: lvgl.is_paused
        then:
          - logger.log: "LVGL resuming"
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: displaybacklight
  
# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Bluetooth
# -----------------------------------------------------------------------------
esp32_ble_tracker:

ble_client:
  - mac_address: DE:40:EE:1E:E5:59
    id: itag_black
    auto_connect: true

# -----------------------------------------------------------------------------
# Lvgl
# -----------------------------------------------------------------------------
lvgl:
  id: lvgl_id
  rotation: 90  # <-- Place rotation here
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: displaybacklight
      - lvgl.pause:
  theme:
    dark_mode: true
    obj:
      bg_color: 0x1F2937
      bg_opa: 30%
      radius: 8
      border_color: 0x4B5563
      border_width: 1
      
  top_layer:
    scrollbar_mode: "OFF"
    widgets:
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          #bg_color: 0xffffff
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - image:
                align: CENTER
                src: boot_logo
                y: -50
            - spinner:
                align: CENTER
                y: 50
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  #arc_color: 0x18bcf2
                  arc_width: 8
          on_press:
            - lvgl.page.next: 
      - obj:
          id: ota_box
          hidden: true
          align: center
          width: 90%
          height: 120
          widgets:
            - label:
                id: ota_label
                align: top_mid
                text: "Updating..."
            - bar:
                id: ota_bar
                align: bottom_mid
                width: 100%
                height: 24
                min_value: 0
                max_value: 100
                value: 0
      - buttonmatrix:
          id: top_layer
          x: 0
          y: 0
          width: 100%
          height: 30
          align: BOTTOM_MID
          outline_width: 0
          pad_all: 0
          rows:
            - buttons:
              - id: page_prev
                text: "\uF053"
                on_press:
                  then:
                    lvgl.page.previous:
              - id: page_home
                text: "\uF015"
                on_press:
                  then:
                    lvgl.page.show: pagehome
              - id: page_next
                text: "\uF054"
                on_press:
                  then:
                    lvgl.page.next:
  pages:
    - id: pagehome
      widgets:
        - buttonmatrix:
            id: lv_buttonmatrix_13
            x: 20
            y: 20
            width: 280
            height: 180
            text_font: mdi_font
            rows:
              - buttons:
                  - id: btn_settings
                    text: "\U000F0493"
                    on_press:
                      then:
                        lvgl.page.show: pagesettings
                  - id: btn_2
                    text: ""
                  - id: btn_3
                    text: ""
              - buttons:
                  - id: btn_4                    
                    text: "\U000F050F"
                  - id: btn_5
                    text: ""
                  - id: btn_6
                    text: ""        
    - id: pagesettings
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            id: lv_obj_header
            x: 0
            y: 0
            width: 280
            height: 25
            align: TOP_MID
            pad_all: 0
            widgets:
              - label:
                  id: lbl_header
                  x: 0
                  y: 0
                  width: 240
                  height: 20
                  align: TOP_MID
                  text: "Settings"
                  text_align: CENTER

        - obj:
            id: objsettings
            x: 10
            y: 30
            width: 300
            height: 175
            pad_all: 0
            widgets:
              - obj:
                  id: lv_obj_slidertimeout
                  x: 10
                  y: 5
                  width: 280
                  height: 60
                  pad_all: 0
                  widgets:
                    - slider:
                        id: lv_slidertimeout
                        x: 15
                        y: 25
                        width: 200
                        height: 20
                        value: 15
                        min_value: 10
                        max_value: 180
                        radius: 9999
                        on_value:
                          - lvgl.widget.update: 
                              id: lv_slidertimeout
                          - lvgl.label.update: 
                              id: lv_label_screentimeoutvalue
                              text:
                                format: "%d s"
                                args: [int(x)]
                    - label:
                        id: lv_label_screentimeout
                        x: 10
                        y: 0
                        text: "Screen Timeout"
                    - label:
                        id: lv_label_screentimeoutvalue
                        x: 230
                        y: 25
                        text: ""
              - obj:
                  id: lv_obj_25
                  x: 10
                  y: 65
                  width: 280
                  height: 30
                  pad_all: 0
                  widgets:
                    - checkbox:
                        id: lv_cb_read_hp
                        x: 0
                        y: 0
                        align: LEFT_MID
                        text: "Read Heat Pump"
                        state:
                          checked: true
                        pad_column: 10