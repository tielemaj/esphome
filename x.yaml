# -----------------------------------------------------------------------------
# Substitution Variables
# -----------------------------------------------------------------------------
substitutions:
  device_internal_name: testes32s
  device_friendly_name: testes32s
  device_wifi_name: testes32s
  device_sampling_time: 30s

# -----------------------------------------------------------------------------
# Common Packages
# -----------------------------------------------------------------------------
packages:
  # ---------------------------------------------------------------------------
  # Board
  # ---------------------------------------------------------------------------
  board: !include boards/esp32/lolind32pro.yaml
  settings: !include common/core/settings.yaml

  # ---------------------------------------------------------------------------
  # Network
  # ---------------------------------------------------------------------------
  wifi: !include common/network/wifi.yaml
  webserver: !include
    file: common/network/webserver.yaml
    vars:
      version: 3
  bluetooth: !include common/network/bluetooth_tracker.yaml

# -----------------------------------------------------------------------------
# Custom Device Configuration
# -----------------------------------------------------------------------------
# SPI
spi:
  id: lcd_spi
  mosi_pin: GPIO23
  miso_pin: GPIO19
  clk_pin: GPIO18
  #cs_pin: 

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Sensors
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Binary Sensors
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Switchs
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    pin: GPIO15
    id: displaybacklight
    name: "Display Backlight"
    restore_mode: ALWAYS_ON
    inverted: true

# -----------------------------------------------------------------------------
# Display
# -----------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: my_font
    size: 20

display:
  - platform: mipi_spi
    model: ILI9341
    spi_id: lcd_spi
    dc_pin: GPIO4
    cs_pin: GPIO5
    reset_pin: GPIO22
    color_depth: 8bit       # Voorkomt geheugencrashes (16bit kan mits PSRAM)
    rotation: 90
#    lambda: |-
#      // Print the string "Hello World!" at [0,10]
#      it.line(0, 0, 50, 50);
#      it.print(0, 10, id(my_font), "Hello World!");

# -----------------------------------------------------------------------------
# Touchscreen
# -----------------------------------------------------------------------------
touchscreen:
  platform: xpt2046
  id: my_touchscreen
  cs_pin: GPIO14
  interrupt_pin: GPIO2
  update_interval: 50ms
  threshold: 400
#  transform:
#    mirror_x: true
  calibration:
    x_min: 220
    x_max: 3800
    y_min: 280
    y_max: 3830

# -----------------------------------------------------------------------------
# Lights
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------

esp32_ble_tracker:

ble_client:
  - mac_address: DE:40:EE:1E:E5:59
    id: itag_black
    auto_connect: true