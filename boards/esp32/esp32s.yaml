################################################################################
# ESP 32 S
################################################################################
# Usage:
#   Add the following code to package section in the device file
# ------------------------------------------------------------------------------
# packages:
#   board: !include boards/esp32/esp32syaml
# ------------------------------------------------------------------------------
# Author: Joris Tielemans
################################################################################

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      minimum_chip_revision: "3.1"
      sram1_as_iram: true